name: h

on:
  schedule:
    - cron: "0/30 * * * *"
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths:
      - .github/workflows/h.yml

jobs:
  get:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        config:
          - { token: "HP0", projectId: "HP0ID", projectName: "HP0NAME" }
          - { token: "HP1", projectId: "HP1ID", projectName: "HP1NAME" }
    env:
      USER_NAME: ${{ secrets.USER }}
      API: ${{ secrets.HAPI }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.HPAT }}

      - name: Set file path
        run: echo "SERVERS_FILE=data-raw/${{ matrix.config.projectId }}/${{ matrix.config.projectName }}/servers.json" >> $GITHUB_ENV

      - name: Ensure directories
        run: |
          mkdir -p data-raw/${{ matrix.config.projectId }}/${{ matrix.config.projectName }}
          mkdir -p data-processed/${{ matrix.config.projectId }}/${{ matrix.config.projectName }}

      - name: Fetch API data
        run: |
          curl -X GET "${{ env.API }}/servers" \
              -H "Authorization: Bearer ${{ secrets[matrix.config.token] }}" \
              -H "Content-Type: application/json" -o ${{ env.SERVERS_FILE }}
        continue-on-error: false

      - name: Process data
        run: |
          node js/h.js ${{ env.SERVERS_FILE }}

  save:
    needs: get
    runs-on: ubuntu-latest
    steps:
      - name: Set current timestamp
        run: echo "NOW=$(date +'%Y-%m-%d %H:%M')" >> $GITHUB_ENV

      - name: Verify data-processed directory
        run: |
          find data-processed -type f

      - name: Push
        uses: cpina/github-action-push-to-another-repository@v1.7.2
        env:
          API_TOKEN_GITHUB: ${{ secrets.HPAT }}
        with:
          source-directory: "data-processed"
          target-directory: "data"
          destination-github-username: ${{ secrets.USER }}
          destination-repository-name: "data-hetzner"
          commit-message: "Update at ${{ env.NOW }}"
          target-branch: branch # Ensure this is the correct branch name
          create-target-branch-if-needed: true
