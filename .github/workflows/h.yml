name: h

on:
  schedule:
    - cron: "0 0/3 * * *"
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths:
      - .github/workflows/h.yml

jobs:
  get:
    runs-on: ubuntu-latest

    env:
      USER_NAME: ${{ secrets.USER }}
      HAPI: ${{ secrets.HAPI }}
      HP0: ${{ secrets.HP0 }}
      HP0ID: ${{ secrets.HP0ID }}
      HP0NAME: ${{ secrets.HP0NAME }}
      HP1: ${{ secrets.HP1 }}
      HP1ID: ${{ secrets.HP1ID }}
      HP1NAME: ${{ secrets.HP1NAME }}
      HP2: ${{ secrets.HP2 }}
      HP2ID: ${{ secrets.HP2ID }}
      HP2NAME: ${{ secrets.HP2NAME }}
      HPAT: ${{ secrets.HPAT }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.HPAT }}

      - name: Process data
        run: |
          node js/h.js

      - name: Set Current Timestamp
        run: echo "NOW=$(date +'%Y-%m-%d %H:%M')" >> $GITHUB_ENV

      - name: Push
        uses: cpina/github-action-push-to-another-repository@v1.7.2
        env:
          API_TOKEN_GITHUB: ${{ secrets.HPAT }}
        with:
          source-directory: "data/processed/h"
          target-directory: "data"
          destination-github-username: ${{ secrets.USER }}
          destination-repository-name: "data-hetzner"
          commit-message: "Update at ${{ env.NOW }}"
          target-branch: main
          create-target-branch-if-needed: true
