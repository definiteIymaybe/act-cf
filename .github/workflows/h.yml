name: h

on:
  schedule:
    - cron: "0/30 * * * *"
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths:
      - .github/workflows/h.yml

jobs:
  get:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        config:
          - { token: "HP0", projectId: "HP0ID", projectName: "HP0NAME" }
          - { token: "HP1", projectId: "HP1ID", projectName: "HP1NAME" }
    env:
      TOKEN: ${{ secrets[matrix.config.token] }}
      PROJECT_ID: ${{ secrets[matrix.config.projectId] }}
      PROJECT_NAME: ${{ secrets[matrix.config.projectName] }}
      USER_NAME: ${{ secrets.USER }}
      API: ${{ secrets.HAPI }}
      SERVERS_FILE: data/raw/servers.json

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.HPAT }}

      - name: Set file path
        run: echo "SERVERS_FILE=data/raw/${{ env.PROJECT_ID }}/${{ env.PROJECT_NAME }}/servers.json" >> $GITHUB_ENV

      - name: Ensure directories
        run: mkdir -p data/raw/${{ env.PROJECT_ID }}/${{ env.PROJECT_NAME }}

      - name: Fetch API data
        run: |
          curl -X GET "${{ env.API }}/servers" \
              -H "Authorization: Bearer ${{ env.TOKEN }}" \
              -H "Content-Type: application/json" -o ${{ env.SERVERS_FILE }}
        env:
          TOKEN: ${{ secrets[matrix.config.token] }}
        continue-on-error: false

      - name: Process data
        run: |
          node js/h.js ${{ env.SERVERS_FILE }}
          rm ${{ env.SERVERS_FILE }}

  save:
    needs: get
    runs-on: ubuntu-latest
    steps:
      - name: Set current timestamp
        run: echo "NOW=$(date +'%Y-%m-%d %H:%M')" >> $GITHUB_ENV

      - name: Push
        uses: cpina/github-action-push-to-another-repository@v1.7.2
        env:
          API_TOKEN_GITHUB: ${{ secrets.HPAT }}
        with:
          source-directory: "data/processed"
          target-directory: "data"
          destination-github-username: ${{ secrets.USER }}
          destination-repository-name: "data-hetzner"
          commit-message: "Update at ${{ env.NOW }}"
          target-branch: brranch
          create-target-branch-if-needed: true
