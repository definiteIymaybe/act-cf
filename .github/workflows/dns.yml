name: dns
on:
  schedule:
    - cron: "0/30 * * * *"
  workflow_dispatch: {}
  push:
    paths:
      - .github/workflows/dns.yml

jobs:
  dns-scheduled:
    runs-on: ubuntu-latest
    env:
      RAW_DIR: "data/dns/raw"
      TOKEN: ${{ secrets.TOKEN }}
      API: ${{ secrets.API }}
      DEST_REPO: "data-cf-dns" # Define the destination repository here
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT }}

      - name: ensure dirs
        run: |
          mkdir -p "${RAW_DIR}/records"
          mkdir -p "data/dns/records"

      # - name: Test GitHub PAT validity
      #   id: test-pat
      #   run: |
      #     PAT_VALID=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: token ${{ secrets.PAT }}" https://api.github.com/repos/${{ env.DEST_REPO }}/contents/)
      #     if [ "$PAT_VALID" -ne 200 ]; then
      #       echo "GitHub PAT is invalid or expired. HTTP status: $PAT_VALID"
      #       exit 1
      #     fi
      #   shell: bash

      - name: get zones
        run: |
          ZONES_FILE="${RAW_DIR}/zones.json"
          RESPONSE=$(curl -s -X GET "${API}/zones" \
          -H "Authorization: Bearer $TOKEN" \
          -H "Content-Type:application/json")

          echo "ZONES_FILE: ${ZONES_FILE}"
          echo "RESPONSE: ${RESPONSE}"

          echo "${RESPONSE}" | jq --indent 2 '.result[] |= (if .development_mode? and (.development_mode < 0) then .development_mode = "-" else . end) | .result' > "$ZONES_FILE"

          if ! jq empty "${ZONES_FILE}"; then
            echo "Invalid JSON response"
            exit 1
          fi

          cat "${ZONES_FILE}"
          node index.js "${ZONES_FILE}"

      - name: get records by zone id
        run: |
          ZONES_FILE="${RAW_DIR}/zones.json"
          if [ ! -f "${ZONES_FILE}" ]; then
            echo "Zones file does not exist: ${ZONES_FILE}"
            exit 1
          fi

          JSON=$(cat "${ZONES_FILE}")
          echo "json: $JSON"
          IDS=$(echo "$JSON" | jq -r '.[].id')
          echo "ids: $IDS"

          for ID in $(echo "$IDS"); do
            echo "id: $ID"

            NAME=$(echo "$JSON" | jq -r --arg zoneId "$ID" '.[] | select(.id == $zoneId) | .name')
            echo "name: $NAME"
            URL="${API}/zones/${ID}/dns_records?per_page=500"
            echo "url: $URL"

            RESPONSE=$(curl -s -X GET $URL \
              -H "Authorization: Bearer $TOKEN" \
              -H "Content-Type: application/json")
            
            echo "RESPONSE: $RESPONSE"

            RECORDS_FILE="${RAW_DIR}/records/${NAME}.json"
            echo "$RESPONSE" > "$RECORDS_FILE"
            echo "$RESPONSE" | jq --indent 2 '.result' > "data/dns/records/${NAME}.json"

            echo "RECORDS_FILE: ${RECORDS_FILE}"

            if [ ! -f "${RECORDS_FILE}" ]; then
              echo "Records file does not exist: ${RECORDS_FILE}"
              exit 1
            fi

            cat "${RECORDS_FILE}"
            
            if ! jq empty "data/dns/records/${NAME}.json"; then
              echo "Invalid JSON response for zone ${NAME}"
              exit 1
            fi
            
            node index.js "data/dns/records/${NAME}.json"
          done

      - name: Set current date as env variable
        run: echo "NOW=$(date +'%Y-%m-%d %H:%M')" >> $GITHUB_ENV

      - name: push
        uses: cpina/github-action-push-to-another-repository@v1.7.2
        env:
          API_TOKEN_GITHUB: ${{ secrets.PAT }}
        with:
          source-directory: data
          destination-github-username: ${{ secrets.USER }}
          destination-repository-name: ${{ env.DEST_REPO }}
          commit-message: Update data ${{ env.NOW }}
          target-branch: main
